<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lô Tô · Dò số</title>
<meta name="description" content="Dò lô tô giấy ngay trên điện thoại: chạm số vừa nghe, tự đánh dấu cho cả 8 màu vé và báo ai đang đợi, ai kinh.">
<meta name="theme-color" content="#0d0820">
<meta name="color-scheme" content="dark">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lô Tô">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<!-- Nền 3D (three.js) nằm sau toàn bộ giao diện -->
<canvas id="gl" aria-hidden="true"></canvas>

<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>Lô Tô</h1>
        <small id="brandSub">Dò số cho cả bàn</small>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn install-btn" id="btnInstallTop" type="button" hidden aria-label="Cài ứng dụng về máy"></button>
      <button class="icon-btn" id="btnSound" type="button" aria-label="Bật tắt âm thanh"></button>
    </div>
  </header>

  <!-- Sân khấu: quả bóng 3D vừa gọi + dải bóng gần nhất. Hai ô trống "hero" và "rail" là chỗ canvas 3D vẽ vào. -->
  <section class="stage" id="stage" aria-label="Số vừa gọi">
    <div class="hero-slot" id="heroSlot" title="Vuốt để xoay bóng">
      <div class="ball-fallback" id="ballFallback" aria-hidden="true"><span id="fbNum">?</span></div>
    </div>
    <div class="stage-info">
      <div class="stage-top">
        <span class="eyebrow" id="stageLabel">Chưa gọi số nào</span>
        <span class="count"><b id="countNum">0</b><i>/90</i></span>
      </div>
      <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
      <div class="rail-slot" id="railSlot"></div>
      <div class="stage-chips">
        <span class="schip wait" id="chipWait"></span>
        <span class="schip kinh" id="chipKinh"></span>
      </div>
    </div>
    <div class="sr-only" id="liveCall" aria-live="polite"></div>
  </section>

  <main class="views">

    <!-- 1. GỌI SỐ -->
    <section class="view active" id="view-call" aria-label="Gọi số">
      <div class="install-banner" id="installBanner" hidden></div>
      <div class="pad">
        <div class="grid" id="grid" role="group" aria-label="Bảng số 1 đến 90"></div>
      </div>
      <div class="call-actions">
        <button class="btn" id="btnUndo" type="button"></button>
        <p class="hint" id="hint"></p>
        <span class="typed" id="typed" aria-hidden="true"></span>
      </div>
    </section>

    <!-- 2. THEO DÕI -->
    <section class="view" id="view-watch" aria-label="Theo dõi các màu">
      <div class="pane" id="watchBody"></div>
    </section>

    <!-- 3. VÉ -->
    <section class="view" id="view-tickets" aria-label="Vé">
      <div class="pane" id="ticketBody"></div>
    </section>

    <!-- 4. THÊM -->
    <section class="view" id="view-more" aria-label="Ván chơi và cài đặt">
      <div class="pane" id="moreBody"></div>
    </section>

  </main>

  <nav class="tabbar" id="tabbar" aria-label="Điều hướng">
    <button class="tab active" data-tab="call"    type="button"><span class="tab-ic" data-ic="megaphone"></span><span>Gọi số</span></button>
    <button class="tab"        data-tab="watch"   type="button"><span class="tab-ic" data-ic="radar"></span><span>Theo dõi</span><em class="badge" id="badgeWatch" hidden></em></button>
    <button class="tab"        data-tab="tickets" type="button"><span class="tab-ic" data-ic="ticket"></span><span>Vé</span></button>
    <button class="tab"        data-tab="more"    type="button"><span class="tab-ic" data-ic="sliders-horizontal"></span><span>Thêm</span></button>
  </nav>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="sheetRoot"></div>
<div id="celebrate" aria-live="assertive"></div>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#0d0820;font:16px sans-serif;padding:24px;text-align:center">Ứng dụng cần bật JavaScript để chạy.</p></noscript>
<script src="assets/app.js" defer></script>
</body>
</html>
